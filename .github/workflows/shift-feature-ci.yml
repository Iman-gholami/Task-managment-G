name: Shift Feature CI

on:
  push:
    branches:
      - feature/soc-shift-scheduler-fa
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Shift scheduling unit tests
        run: npm run test:unit
      - name: Next.js production build
        run: npm run build
      - name: Use system Chrome or install Playwright Chromium
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/chromium ]; then
            echo "CHROMIUM_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Playwright E2E
        run: npx playwright test
