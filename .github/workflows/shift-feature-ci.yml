name: Shift Feature CI

on:
  push:
    branches:
      - feature/soc-shift-scheduling-v2
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Shift scheduling unit tests
        run: node --test tests/shifts.unit.test.mjs
      - name: Next.js production build
        run: npm run build
